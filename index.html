<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bread Scale">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>King Arthur Bread Scaler</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #eab308;
      --text: #f3f4f6;
      --subtext: #9ca3af;
      --border: #2d2d2d;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
    }
    h1 { font-size: 1.3rem; text-align: center; margin: 12px 0 16px; color: var(--accent); }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .field { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    label { font-size: 0.9rem; color: var(--subtext); }
    .val-display { font-weight: 700; font-size: 1.1rem; color: var(--accent); }
    select, input[type=number], input[type=text] {
      background: #2a2a2a;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
    }
    input[type=range] { width: 100%; accent-color: var(--accent); margin: 8px 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th { text-align: left; font-size: 0.75rem; color: var(--subtext); text-transform: uppercase; padding-bottom: 6px; }
    td { padding: 8px 0; border-top: 1px solid var(--border); font-size: 0.95rem; }
    .grams { text-align: right; font-weight: 700; color: #fff; }
    .pct { text-align: center; color: var(--subtext); font-size: 0.85rem; }
    .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
    .btn {
      background: #2a2a2a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 0;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .btn:active { background: var(--accent); color: #000; }
    .raw-row { display: grid; grid-template-columns: 2fr 1fr auto; gap: 6px; margin-bottom: 6px; }
    .btn-del { background: #7f1d1d; border: none; color: white; border-radius: 6px; padding: 0 10px; }
  </style>
</head>
<body>

  <h1>King Arthur Bread Scaler</h1>

  <!-- Recipe Selection -->
  <div class="card">
    <label style="display:block; margin-bottom: 6px;">Select Recipe</label>
    <select id="recipeSelect" onchange="loadPreset()">
      <option value="sandwich">KA Classic Sandwich Bread</option>
      <option value="french">KA French Bread / Baguette</option>
      <option value="sourdough">KA Rustic Sourdough</option>
      <option value="custom">Custom Recipe (From Book)...</option>
    </select>
  </div>

  <!-- Custom Entry Section (Hidden unless "Custom" is chosen) -->
  <div class="card" id="customInputCard" style="display: none;">
    <div style="font-size: 0.85rem; color: var(--subtext); margin-bottom: 10px;">
      Enter ingredient weights directly from the book (must include Flour):
    </div>
    <div id="ingredientRows"></div>
    <button class="btn" style="width: 100%; margin-top: 6px;" onclick="addRow()">+ Add Ingredient</button>
  </div>

  <!-- Target Total Weight Control -->
  <div class="card">
    <div class="field">
      <label>Target Dough Weight</label>
      <span class="val-display" id="weightVal">500 g</span>
    </div>
    <input type="range" id="targetWeight" min="200" max="1000" step="10" value="500">
    <div class="presets">
      <button class="btn" onclick="setWeight(250)">250g</button>
      <button class="btn" onclick="setWeight(500)">500g</button>
      <button class="btn" onclick="setWeight(750)">750g</button>
      <button class="btn" onclick="setWeight(1000)">1kg</button>
    </div>
  </div>

  <!-- Scaled Formula Table -->
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Ingredient</th>
          <th style="text-align: center;">%</th>
          <th style="text-align: right;">Grams</th>
        </tr>
      </thead>
      <tbody id="recipeTable"></tbody>
    </table>
  </div>

  <script>
    const PRESETS = {
      sandwich: [
        { name: "Unbleached Bread Flour", grams: 360, isFlour: true },
        { name: "Water (or Milk)", grams: 226, isFlour: false },
        { name: "Butter (softened)", grams: 28, isFlour: false },
        { name: "Sugar or Honey", grams: 21, isFlour: false },
        { name: "Salt", grams: 7, isFlour: false },
        { name: "Instant Yeast", grams: 5, isFlour: false }
      ],
      french: [
        { name: "All-Purpose Flour", grams: 420, isFlour: true },
        { name: "Water", grams: 283, isFlour: false },
        { name: "Salt", grams: 9, isFlour: false },
        { name: "Instant Yeast", grams: 3, isFlour: false }
      ],
      sourdough: [
        { name: "Bread Flour", grams: 360, isFlour: true },
        { name: "Whole Wheat Flour", grams: 60, isFlour: true },
        { name: "Water", grams: 300, isFlour: false },
        { name: "Ripe Sourdough Starter", grams: 120, isFlour: false },
        { name: "Salt", grams: 9, isFlour: false }
      ]
    };

    let activeRecipe = [];

    function loadPreset() {
      const choice = document.getElementById('recipeSelect').value;
      const customCard = document.getElementById('customInputCard');

      if (choice === 'custom') {
        customCard.style.display = 'block';
        if (activeRecipe.length === 0) {
          activeRecipe = [
            { name: "Flour", grams: 500, isFlour: true },
            { name: "Water", grams: 350, isFlour: false },
            { name: "Salt", grams: 10, isFlour: false }
          ];
        }
        renderCustomInputs();
      } else {
        customCard.style.display = 'none';
        activeRecipe = JSON.parse(JSON.stringify(PRESETS[choice]));
      }
      recalculate();
    }

    function renderCustomInputs() {
      const container = document.getElementById('ingredientRows');
      container.innerHTML = '';
      activeRecipe.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'raw-row';
        row.innerHTML = `
          <input type="text" value="${item.name}" placeholder="Name" onchange="updateCustomName(${index}, this.value)">
          <input type="number" value="${item.grams}" placeholder="g" onchange="updateCustomGrams(${index}, this.value)">
          <button class="btn-del" onclick="deleteRow(${index})">✕</button>
        `;
        container.appendChild(row);
      });
    }

    function addRow() {
      activeRecipe.push({ name: "Ingredient", grams: 50, isFlour: false });
      renderCustomInputs();
      recalculate();
    }

    function deleteRow(idx) {
      activeRecipe.splice(idx, 1);
      renderCustomInputs();
      recalculate();
    }

    function updateCustomName(idx, val) {
      activeRecipe[idx].name = val;
      activeRecipe[idx].isFlour = /flour/i.test(val);
      recalculate();
    }

    function updateCustomGrams(idx, val) {
      activeRecipe[idx].grams = parseFloat(val) || 0;
      recalculate();
    }

    function setWeight(val) {
      document.getElementById('targetWeight').value = val;
      recalculate();
    }

    function recalculate() {
      const target = parseFloat(document.getElementById('targetWeight').value);
      document.getElementById('weightVal').innerText = target >= 1000 ? (target/1000).toFixed(1) + ' kg' : target + ' g';

      // 1. Identify total original recipe flour weight
      let totalFlour = activeRecipe.reduce((sum, item) => sum + (item.isFlour ? item.grams : 0), 0);
      if (totalFlour === 0) totalFlour = activeRecipe[0]?.grams || 1; // Fallback if no item called flour

      // 2. Compute Baker's % and total formula percentage
      let totalFormulaPct = 0;
      const computed = activeRecipe.map(item => {
        const pct = (item.grams / totalFlour) * 100;
        totalFormulaPct += pct;
        return { ...item, pct };
      });

      // 3. Scale based on target total dough weight
      const scaleFactor = target / totalFormulaPct;
      let actualTotal = 0;

      const tbody = document.getElementById('recipeTable');
      tbody.innerHTML = '';

      computed.forEach(item => {
        const scaledGrams = Math.round(item.pct * scaleFactor);
        actualTotal += scaledGrams;
        tbody.innerHTML += `
          <tr>
            <td>${item.name}</td>
            <td class="pct">${Math.round(item.pct)}%</td>
            <td class="grams">${scaledGrams} g</td>
          </tr>
        `;
      });

      tbody.innerHTML += `
        <tr style="color: var(--accent); font-weight: bold;">
          <td>Total Yield</td>
          <td></td>
          <td class="grams">${actualTotal} g</td>
        </tr>
      `;
    }

    document.getElementById('targetWeight').addEventListener('input', recalculate);
    loadPreset();
  </script>
</body>
</html>
